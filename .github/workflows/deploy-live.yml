# Deploys the game to https://12321.web.app whenever main changes.
name: Deploy to 12321.web.app
on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: deploy-live
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: project-523229263760528315
          target: game
          channelId: live
